<style>

}

}

}

  display: none !important;
}

@media screen and (min-width: 992px) {
    [class*="show-t"], [show-t] {
        display: none !important;
    }
}

@media screen and (max-width: 991px) {
    [class*="hide-t"], [hide-t] {
        display: none !important;
    }
}
  @media screen and (min-width: 768px) {
    [class*="show-ml"], [show-ml] {
      display: none !important;
    }
}
  @media screen and (max-width: 767px) {
    [class*="hide-ml"], [hide-ml] {
      display: none !important;
    }
    [class*="show-ml"], [show-ml] {
      display: block !important;
    }
}
  @media screen and (min-width: 480px) {
    [class*="show-mp"], [show-mp] {
      display: none !important;
    }
}
  @media screen and (max-width: 479px) {
    [class*="hide-mp"], [hide-mp] {
      display: none !important;
    }

  transition:
    opacity .55s cubic-bezier(.22, .61, .36, 1);

translate: 0 0 0;
  transition: translate 0.25s ease;

}

.work-item:hover + .work-item .work-grid-img-wrap {
translate: 0 -1.25rem 0;
margin-left: 0rem;
}


.work-item:has(+ .work-item:hover) .work-grid-img-wrap {
translate: 0 1.25rem 0;
}

  counter-reset: drawing;
}

.drawing-grid > .w-dyn-item {
  counter-increment: drawing;
}

.drawing-grid > .w-dyn-item .drawing-txt::before {
  content: counter(drawing);
  display: inline-block;
}


.load-img {
  opacity: 0;
  animation: loop 0.7s infinite steps(1);
}

.load-img:nth-child(1) { animation-delay: 0s; }
.load-img:nth-child(2) { animation-delay: 0.1s; }
.load-img:nth-child(3) { animation-delay: 0.2s; }
.load-img:nth-child(4) { animation-delay: 0.3s; }
.load-img:nth-child(5) { animation-delay: 0.4s; }
.load-img:nth-child(6) { animation-delay: 0.5s; }
.load-img:nth-child(7) { animation-delay: 0.6s; }

@keyframes loop {
  0%   { opacity: 1; }
  14%  { opacity: 1; }
  15%  { opacity: 0; }
  100% { opacity: 0; }
}
@media (max-width: 767px) {
.load-img {
  opacity: 0;
  animation: loop 2.8s infinite steps(1);
}

.load-img:nth-child(1) { animation-delay: 0s; }
.load-img:nth-child(2) { animation-delay: 0.4s; }
.load-img:nth-child(3) { animation-delay: 0.8s; }
.load-img:nth-child(4) { animation-delay: 1.2s; }
.load-img:nth-child(5) { animation-delay: 1.6s; }
.load-img:nth-child(6) { animation-delay: 2.0s; }
.load-img:nth-child(7) { animation-delay: 2.4s; }

}

html:not(.wf-design-mode) .load-img-wrap{position: absolute; left: 50%; top: 50%; width: 81em; min-width: 0; transform: translate(-50%, -50%) scale(0);}

/*/ Skip link and focus target /*/

.skip-link:focus-visible{transform: none;}
main[tabindex="-1"]:focus{outline: none;}
