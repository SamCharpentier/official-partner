<!-- Fallback: if jsDelivr did not deliver, the same files from unpkg and githack, in the same order -->
<script>
(function () {
  if (window.opSite) return;
  var files = [];
  if (!window.barba) files.push('https://unpkg.com/@barba/core@2.10.3/dist/barba.umd.js');
  if (!window.Lenis) files.push('https://unpkg.com/lenis@1.3.17/dist/lenis.min.js');

  (function next() {
    var src = files.shift();
    if (!src) return;
    var s = document.createElement('script');
    s.src = src;
    s.onload = s.onerror = next;
    document.body.appendChild(s);
  })();
})();
</script>
