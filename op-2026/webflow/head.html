<!-- Home intro: once per session. Skipped (loader hidden before first paint) when already seen or with reduced motion.
     Safety net: if the site JS has not started after 5 s, the loader is hidden so the page is never stuck behind it. -->
<script>(function(){var d=document.documentElement;try{if(sessionStorage.getItem('op-intro-seen')||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches))d.classList.add('op-intro-seen')}catch(e){}setTimeout(function(){if(!window.opIntroStarted)d.classList.add('op-intro-seen')},5000)})();</script>
